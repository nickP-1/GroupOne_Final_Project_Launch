<!DOCTYPE html>
<html>
<head>
    <title>Delete Card</title>
</head>

<body>

    <h1>Delete Card</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ card.name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'inventory' %}">Cancel</a>

</body>
</html>
