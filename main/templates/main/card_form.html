<!DOCTYPE html>
<html>
<head>
    <title>{{ page_title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }

        form {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 8px;
        }

        input, textarea, select {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 8px 0 16px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            background: #198754;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<form method="POST">
    {% csrf_token %}

    <h1>{{ page_title }}</h1>

    {{ form.as_p }}

    <button type="submit">Save Card</button>

    <p>
        <a href="{% url 'inventory' %}">Cancel</a>
    </p>
</form>

</body>
</html>
