{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: blue;
        }
        .username {
            color: black;
            text-align: left;
            margin-left: 20px;
            font-size: 24px;
        }
        .gif-container {
    display: flex;
    justify-content: center;
    margin-top: 40px;
    width: 100%;
}
        .gif-container img {
    width: 250px;
    border-radius: 10px;
}
        .categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-top: 50px;
    padding: 20px;
}
        .card-section {
    background-color: white;
    border: 2px solid #ccc;
    min-height: 400px;
    border-radius: 10px;
    padding: 10px;
}
        .card-section h2 {
    color: black;

    </style>
</head>
<body>
    <h1>Welcome To Cards Emporium</h1>
    <p>The Best Trading Card Website Ever!</p>

    <h2 class="username">Hello {{ name }}, What Would You Like To Do Today!</h2>

    <div class="categories">
        <div class="card-section">
            <h2>Buying Cards</h2>
        </div>

        <div class="card-section">
            <h2>Selling Cards</h2>
        </div>

        <div class="card-section">
            <h2>Tracking Cards</h2>
        </div>

        <div class="card-section">
            <h2>Inventory</h2>
        </div>
    </div>
         <div class="gif-container">
    <img src="{% static 'images/o17jbi95vihb1.gif' %}" alt="Sol Ring">
    </div>
</body>
